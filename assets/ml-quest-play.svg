<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="340" height="70" role="img" aria-label="Play ML Quest">
<style>@font-face{font-family:'Pixelify Sans';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Pixelify Sans';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}
  .px{font-family:'Pixelify Sans',ui-monospace,'SFMono-Regular',Menlo,monospace;font-weight:700;}
  .blink{animation:bl 1s steps(1) infinite;}
  @keyframes bl{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.blink{animation:none}}
</style>
