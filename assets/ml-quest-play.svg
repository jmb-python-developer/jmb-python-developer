<rect x="0" y="0" width="340" height="64" fill="#FFC247"/>
<rect x="4" y="4" width="332" height="4" fill="#FFE08A"/>
<polygon class="blink" points="34,20 34,44 52,32" fill="#5C3F00"/>
<text x="186.0" y="42" text-anchor="middle" class="px" font-size="26" letter-spacing="2" fill="#5C3F00">PLAY ML QUEST</text>
</svg>